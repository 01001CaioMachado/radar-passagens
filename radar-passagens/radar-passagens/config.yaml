# Aeroportos de saída
origens:
  GRU: São Paulo (Guarulhos)
  CGH: São Paulo (Congonhas)
  VCP: Campinas (Viracopos)
  RAO: Ribeirão Preto
  SJP: São José do Rio Preto

# Quantos meses à frente procurar
meses_a_frente: 8

# Destinos por região.
# tipo: ida_volta ou ida  |  nacional usa "ida" porque trechos se combinam livremente
regioes:
  europa:
    nome: Europa
    tipo: ida_volta
    destinos:
      LIS: Lisboa
      OPO: Porto
      MAD: Madri
      BCN: Barcelona
      PAR: Paris
      ROM: Roma
      MIL: Milão
      LON: Londres
      AMS: Amsterdã
      FRA: Frankfurt
  eua:
    nome: EUA / Orlando
    tipo: ida_volta
    destinos:
      MCO: Orlando
      MIA: Miami
      FLL: Fort Lauderdale
      NYC: Nova York
  america_sul:
    nome: América do Sul
    tipo: ida_volta
    destinos:
      SCL: Santiago
      BUE: Buenos Aires
      MVD: Montevidéu
      LIM: Lima
      BOG: Bogotá
      CTG: Cartagena
  nacional:
    nome: Nacional
    tipo: ida
    destinos:
      SSA: Salvador
      REC: Recife
      FOR: Fortaleza
      MCZ: Maceió
      NAT: Natal
      JPA: João Pessoa
      FLN: Florianópolis
      POA: Porto Alegre
      CWB: Curitiba
      IGU: Foz do Iguaçu
      BSB: Brasília
      RIO: Rio de Janeiro
      MAO: Manaus
      BEL: Belém

# ---------------- Regras de oportunidade ----------------
# Com histórico (a partir de N dias de coleta da rota):
oportunidade:
  min_dias_historico: 5        # dias com coleta antes de confiar no histórico
  janela_historico_dias: 60    # período usado para calcular o preço "normal"
  desconto_bom: 0.20           # 20% abaixo do normal  -> "Boa"
  desconto_otimo: 0.35         # 35% abaixo            -> "Ótima"
  desconto_erro: 0.55          # 55% abaixo            -> "Possível erro tarifário"

# Sem histórico ainda (primeiros dias): preço de referência em R$ por região.
# "bom" e "otimo" são valores totais (ida e volta quando a região é ida_volta).
# AJUSTE à sua realidade — são pontos de partida, não verdades de mercado.
referencia_inicial:
  europa:      {bom: 3800, otimo: 3000}
  eua:         {bom: 3300, otimo: 2600}
  america_sul: {bom: 1700, otimo: 1250}
  nacional:    {bom: 350,  otimo: 230}

# ---------------- Milhas ----------------
milhas:
  # Quanto você paga, em média, por mil milhas (custo do seu milheiro).
  # Ex.: 30 mil Livelo + 100% de bônus = 60 mil milhas. Se comprou os pontos
  # por R$ 1.050, o milheiro custou R$ 17,50.
  meu_custo_milheiro: 17.50
  # Só vale emitir com milhas se cada milheiro "render" pelo menos isto em R$:
  valor_minimo_milheiro: 25.00
  # Taxas de embarque estimadas (R$) que você paga mesmo emitindo com milhas
  taxas_estimadas:
    europa: 600        # ida e volta, sem sobretaxa de combustível
    eua: 450
    america_sul: 250
    nacional: 60       # por trecho
